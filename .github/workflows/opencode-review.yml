name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: >
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode review
        uses: anomalyco/opencode/github@latest
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        with:
          model: zai-coding-plan/glm-4.7
          share: false
          prompt: |
            This is a cross-platform Go TUI application (Charmbracelet BubbleTea + Bubbles) that captures and decodes Albion Online network traffic using gopacket and libpcap (CGO). It parses the Photon Engine protocol and Protocol16 encoding to track in-game events (fame, silver, loot).

            Please review all the code changes in this pull request. Diffs are important but make sure you read the entire file to get proper context.

            ## What to look for

            1. **Bugs and logic errors** — incorrect conditions, nil pointer dereferences, missing error handling, race conditions, goroutine leaks
            2. **Security vulnerabilities** — hardcoded secrets, improper input validation, unsafe handling of raw network data, buffer overflows in protocol parsing
            3. **Error handling** — errors that are silently ignored, missing cleanup on failure, unclear error messages
            4. **Concurrency issues** — data races between packet capture goroutines and TUI updates, missing mutex locks, channel deadlocks, goroutines that never terminate
            5. **Resource leaks** — unclosed packet captures, file handles, goroutines without shutdown paths
            6. **Cross-platform concerns** — code that assumes Linux-only behavior (e.g., hardcoded paths, platform-specific syscalls) without build tags or runtime checks for Windows/macOS
            7. **Protocol parsing correctness** — off-by-one errors in buffer reads, incorrect byte order assumptions, missing bounds checks on packet data
            8. **Test coverage** — new logic without corresponding tests, tests that don't actually assert behavior
            9. **Outdated comments and documentation** — comments, docstrings, or inline documentation that no longer reflect the current code behavior (e.g., referencing removed functions, describing old logic, or mentioning features that were changed in this PR)
            10. **Hardcoded values** — magic numbers, hardcoded ports, timeouts, or buffer sizes that should be constants or configurable

            ## What NOT to do

            - Do NOT nitpick formatting — the project uses go fmt
            - Do NOT complain about naming conventions unless genuinely confusing
            - Do NOT suggest changes that are purely stylistic preferences
            - Do NOT flag issues in code that was not changed in this PR
            - Do NOT invent hypothetical problems — if an edge case matters, explain the realistic scenario where it breaks
            - Do NOT overstate severity — clearly communicate whether something is a bug, a potential issue, or just a suggestion
            - Make it clear that suggestions are merely suggestions and the human can decide what to do

            ## How to communicate feedback

            - Be direct and concise — the reader should quickly understand the issue without reading too closely
            - Clearly explain the scenario or conditions under which the issue arises
            - If flagging a bug, be confident it actually is one — investigate first if unsure
            - Use a matter-of-fact tone, not accusatory or overly positive
            - Avoid flattery or filler comments like "Great job" or "Thanks for"

            If the code looks good and follows all guidelines, just comment: "lgtm"
